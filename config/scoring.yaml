# ХАЙП-ОЦЕНКА 0–100
# Каждая часть даёт число от 0 до 1, умножается на вес и всё складывается.
# Сумма весов = максимум оценки (лучше держать 100).

weights:
  outlets: 40     # сколько разных изданий написали за 24 ч
  growth: 25      # насколько быстро растёт за последние 3 ч
  reddit: 20      # лайки + комментарии на Reddit
  trends: 10      # тема есть в Google Trends Британии
  ru_telegram: 5  # просмотры в ру-Телеграме (малый вес; поставь минус, чтобы штрафовать уже разошедшееся)

caps:              # «потолки»: при таком значении часть = 1 (максимум)
  outlets: 25
  growth_ratio: 4      # в 4 раза больше публикаций, чем обычно за 3 ч
  reddit: 20000        # лайки + 2×комменты
  ru_telegram_views: 500000

rising:            # метка 🚀 РАСТЁТ
  min_outlets_3h: 3    # хотя бы 3 издания за последние 3 ч
  min_ratio: 2         # и в 2+ раза больше обычного темпа

first:             # метка 🥇 ЕЩЁ НИКТО НЕ НАПИСАЛ
  min_outlets_24h: 3   # уже 3+ издания в UK/EU, а в ру-Телеге пусто

clustering:        # склейка одной истории из разных источников
  similarity: 0.32     # чем выше, тем строже склейка (0.25–0.5)
  merge_window_hours: 36
  telegram_match: 0.35 # насколько пост в Телеге должен совпадать с сюжетом
