  - {match: [CCTV, cameras, facial recognition, surveillance, камер], ep: "День 51 · Камеры", views: "100к", subs: "0.98", angle: "«Отпиздили под камерами — записи никто не запросил» + «улыбнись и подпишись, тебя снимает камера»"}
  - {match: [grooming, rape gang, Rotherham, Rochdale, Telford], ep: "НЕ СНЯТО · груминг-банды", views: "—", subs: "—", angle: "Главная непокрытая тема по атласу — трилогия Rotherham → Rochdale → Telford"}
  - {match: [Europe is finished, end of Europe, civilisation, Western civilization, Европ], ep: "День 47 · Манифест «Европы нет»", views: "134к", subs: "11.77 (рекорд)", angle: "Манифест раз в 25–30 серий: назвать оппонентов, «свои люди», миссия"}
