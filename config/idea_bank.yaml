# БАНК ИДЕЙ ДЛЯ ВИДЕО — темы по формулам твоих хитов (библия + атлас).
# Это НЕ новости. Новость — только «🔥 повод»: если в СМИ сейчас есть сюжет по теме, идея поднимается наверх.
#
# Поля:
#   t       — тема / 2-я строка обложки («Британцы ненавидят гигиену»)
#   hook    — хук-приговор (черновик, перепиши своим голосом)
#   fmt     — формат: Прайм | Квиз | Манифест | Трилогия | Визуальный выброс
#   seg     — рубрика
#   status  — new (ещё не снимал) | return (возврат с новым углом) | cooled (недавно снимал — только с новым углом)
#   etalon  — на какую твою серию похоже (цифры из атласа)
#   why     — почему сработает (из библии)
#   angle   — где взять личную виньетку / персонажа
#   details — 3 живописные детали, которые надо найти или вспомнить (то, что нельзя нагуглить)
#   quote   — заготовка готовой цитаты
#   match   — слова для поиска повода в новостях (по началу слова, на английском)
#   base    — базовый потенциал 0–60 (по силе эталона и рубрики)

